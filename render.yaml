services:
  - type: web
    name: yourtube
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn yourtube.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: yourtube-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: YOURTUBE_DATA_DIR
        value: /var/data
      - key: YOURTUBE_MEDIA_ROOT
        value: /var/data/media
