{% load static %}
<div class="flex gap-4 overflow-x-auto pb-3">
  {% for item in videos %}
    <a class="w-52 shrink-0" href="{% url 'video-detail' item.pk %}">
      <span class="relative block aspect-video overflow-hidden bg-surface-alt">
        {% if item.local_thumbnail_available %}
          <img class="h-full w-full object-cover" src="/{{ item.thumbnail_loc|urlencode:'/' }}" data-fallback="{{ item.thumbnail_url }}" onerror="var fallback=this.dataset.fallback;this.dataset.fallback='';if(fallback){this.src=fallback}else{this.onerror=null;this.src='{% static 'videos/img/video-placeholder.svg' %}'}" alt="{{ item.title }} thumbnail" loading="lazy" />
        {% elif item.thumbnail_url %}
          <img class="h-full w-full object-cover" src="{{ item.thumbnail_url }}" data-fallback="{% static 'videos/img/video-placeholder.svg' %}" onerror="this.onerror=null;this.src=this.dataset.fallback" alt="{{ item.title }} thumbnail" loading="lazy" />
        {% else %}
          <img class="h-full w-full object-cover" src="{% static 'videos/img/video-placeholder.svg' %}" alt="{{ item.title }} thumbnail unavailable" loading="lazy" />
        {% endif %}
        <span class="video-duration-badge absolute bottom-1.5 right-1.5 bg-black/80 px-1.5 py-0.5 text-xs" data-video-duration="{{ item.duration }}">{{ item.duration }}</span>
      </span>
      <span class="mt-2 line-clamp-2 block text-sm font-semibold hover:text-accent-light">{{ item.title }}</span>
    </a>
  {% empty %}
    <p class="text-sm text-subtle">{{ empty_message }}</p>
  {% endfor %}
</div>
