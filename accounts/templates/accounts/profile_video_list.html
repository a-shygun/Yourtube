<div class="flex flex-col gap-3">
  {% for item in video_statuses %}
    <a class="flex items-center gap-4 border border-line p-3 hover:bg-surface-alt" href="{% url 'video-detail' item.video_id %}">
      <img class="aspect-video w-40 object-cover" src="{% url 'library-media' item.video.thumbnail_loc %}" alt="{{ item.video.title }} thumbnail" loading="lazy" />
      <span class="flex-1 line-clamp-2 text-sm font-medium">{{ item.video.title }}</span>
      <span class="text-sm text-muted">{{ item.get_status_display }}</span>
    </a>
  {% empty %}
    <p class="text-sm text-subtle">{{ empty_message }}</p>
  {% endfor %}
</div>
