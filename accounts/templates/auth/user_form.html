{% extends 'videos/main.html' %}
{% load crispy_forms_tags %}

{% block title %}
  Create account · YourTube
{% endblock %}
{% block content %}
  <section class="mx-auto my-12 max-w-md border border-line bg-surface p-6">
    <p class="font-semibold text-accent">JOIN YOURTUBE</p>
    <h1 class="mt-2 text-2xl font-bold">Create account</h1>
    <form class="mt-5 space-y-4" method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <button class="w-full bg-accent px-4 py-2 text-white hover:bg-accent-hover focus:outline-none focus:ring-2 focus:ring-focus" type="submit">Create account</button>
    </form>
    <p class="mt-5 text-sm text-muted">
      Already have an account? <a class="text-accent-light hover:text-ink" href="{% url 'login' %}">Log in</a>
    </p>
  </section>
{% endblock %}
