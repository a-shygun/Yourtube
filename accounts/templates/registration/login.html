{% extends 'videos/main.html' %}
{% load crispy_forms_tags %}
{% block title %}
  Log in · YourTube
{% endblock %}
{% block content %}
  <section class="mx-auto my-12 max-w-md border border-line bg-surface p-6">
    <p class="font-semibold text-accent">WELCOME BACK</p>
    <h1 class="mt-2 text-2xl font-bold">Log in</h1>
    <form class="mt-5 space-y-4" method="post">
      {% csrf_token %}
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}" />
      {% endif %}
      {{ form|crispy }}
      <button class="bg-accent px-4 py-2 text-white hover:bg-accent-hover focus:outline-none focus:ring-2 focus:ring-focus" type="submit">Log in</button>
    </form>
    <p class="mt-5 text-sm text-muted">
      New to YourTube? <a class="text-accent-light hover:text-ink" href="{% url 'register' %}">Create an account</a>
    </p>
  </section>
{% endblock %}
